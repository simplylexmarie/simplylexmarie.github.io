<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to webdesign.simplylexmarie.com</title>
<link rel="canonical" href="https://webdesign.simplylexmarie.com/">
<meta name="robots" content="noindex">
<script>
  (function () {
    var base = "https://webdesign.simplylexmarie.com/";
    // Preserve anything after /web-design-portfolio/ so deep links still land.
    var rest = location.pathname.replace(/^\/web-design-portfolio\/?/, "");
    location.replace(base + rest + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://webdesign.simplylexmarie.com/">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 32rem; margin: 20vh auto; padding: 0 1.25rem; color: #2b1b22; text-align: center; }
  a { color: #7a1f3d; }
</style>
</head>
<body>
<p>This portfolio has moved to <a href="https://webdesign.simplylexmarie.com/">webdesign.simplylexmarie.com</a>.</p>
<p>Taking you there now&hellip;</p>
</body>
</html>
